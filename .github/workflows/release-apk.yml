name: Build Signed Public Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Public version name (example: 26.0.0)"
        required: true
        type: string
      version_code:
        description: "Android versionCode (must increase for every public release)"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: marc-public-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify exact release source and repository config
        run: |
          set -euo pipefail
          test -f www/index.html
          test -f package.json
          test -f capacitor.config.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          expected = "620c5c3b202b1be86f49bc5dfaec2abdc471c3ea474e632f31b3c21298508bc3"
          for name in ("package.json", "capacitor.config.json"):
              json.loads(Path(name).read_text())
              print(f"{name}: JSON parse PASS")
          actual = hashlib.sha256(Path("www/index.html").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"www/index.html SHA256 mismatch: expected {expected}, got {actual}")
          print(f"www/index.html exact release SHA256 PASS: {actual}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate release inputs and signing secrets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          KEYSTORE_B64: ${{ secrets.MARC_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MARC_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARC_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MARC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}([.-][A-Za-z0-9]+)*$ ]] || { echo "Invalid version_name: $VERSION_NAME"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version_code must be a positive integer"; exit 1; }
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Secret: $name"
              exit 1
            fi
          done

      - name: Install npm dependencies reproducibly when possible
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "package-lock.json found: using npm ci"
            npm ci
          else
            echo "::warning::package-lock.json is missing. Falling back to npm install; dependency resolution is not perfectly reproducible."
            npm install
          fi

      - name: Ensure Capacitor discovers required native plugins
        run: |
          set -euo pipefail
          CAP_MAJOR="$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")"
          echo "Capacitor major: $CAP_MAJOR"
          # cap sync inspects package.json when includePlugins is not explicitly configured.
          # Save these dependencies in the ephemeral Actions workspace so plugin discovery is deterministic.
          npm install --save-exact --package-lock=false "@capacitor/local-notifications@$CAP_MAJOR" "@capacitor/filesystem@$CAP_MAJOR" "@capacitor/share@$CAP_MAJOR"
          node - <<'NODE'
          const pkg=require('./package.json');
          const coreMajor=require('./node_modules/@capacitor/core/package.json').version.split('.')[0];
          for(const name of ['@capacitor/local-notifications','@capacitor/filesystem','@capacitor/share']){
            const declared=pkg.dependencies?.[name]||pkg.devDependencies?.[name];
            if(!declared)throw new Error(`${name} is not declared in package.json after install`);
            const installed=require(`./node_modules/${name}/package.json`).version;
            if(installed.split('.')[0]!==coreMajor)throw new Error(`${name} major ${installed} does not match Capacitor ${coreMajor}`);
            console.log(`${name}: declared ${declared}, installed ${installed} PASS`);
          }
          NODE

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Verify exact V36.12 web bundle copied into Android assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = "620c5c3b202b1be86f49bc5dfaec2abdc471c3ea474e632f31b3c21298508bc3"
          marker = 'window.DT_MARC_RELEASE_FIX_VERSION="36.12-phase12-authoritative-state-consolidation"'
          source = Path("www/index.html")
          bundled = Path("android/app/src/main/assets/public/index.html")
          if not bundled.exists():
              raise SystemExit(f"Android bundled web asset missing: {bundled}")
          source_bytes = source.read_bytes()
          bundled_bytes = bundled.read_bytes()
          source_hash = hashlib.sha256(source_bytes).hexdigest()
          bundled_hash = hashlib.sha256(bundled_bytes).hexdigest()
          if source_hash != expected:
              raise SystemExit(f"Source hash changed before Android sync: {source_hash}")
          if bundled_hash != expected:
              raise SystemExit(f"Android asset hash mismatch: expected {expected}, got {bundled_hash}")
          if source_bytes != bundled_bytes:
              raise SystemExit("Android bundled index.html is not byte-for-byte identical to www/index.html")
          if marker.encode() not in bundled_bytes:
              raise SystemExit("V36.12 Phase 12 APK sync marker missing from Android bundled index.html")
          print(f"Android bundled index.html exact V36.12 SHA256 PASS: {bundled_hash}")
          print("V36.12 Phase 12 APK sync marker PASS")
          PY

      - name: Preserve precise rest notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          perm='<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if perm not in s:
              marker='<application'
              i=s.find(marker)
              if i<0: raise SystemExit("<application> not found in AndroidManifest.xml")
              s=s[:i]+"    "+perm+"\n    "+s[i:]
              p.write_text(s)
          PY

      - name: Apply public version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          code = os.environ["VERSION_CODE"]
          name = os.environ["VERSION_NAME"]
          s, n1 = re.subn(r'(?m)^(\s*versionCode\s+)\d+\s*$', rf'\g<1>{code}', s, count=1)
          s, n2 = re.subn(r'(?m)^(\s*versionName\s+)["\'][^"\']+["\']\s*$', rf'\g<1>"{name}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Could not set versionCode/versionName cleanly (versionCode={n1}, versionName={n2})")
          p.write_text(s)
          print(f"Configured Android versionCode={code}, versionName={name}")
          PY

      - name: Verify notification/filesystem/share native setup
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          grep -n 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/assets/capacitor.plugins.json
          grep -qi 'LocalNotifications' android/app/src/main/assets/capacitor.plugins.json
          grep -qi 'Filesystem' android/app/src/main/assets/capacitor.plugins.json
          grep -qi 'Share' android/app/src/main/assets/capacitor.plugins.json
          if grep -qi 'HealthConnect' android/app/src/main/assets/capacitor.plugins.json; then
            echo "Retired Health Connect plugin unexpectedly present" >&2; exit 1;
          fi
          echo "Notifications + Filesystem + Share native plugin registry PASS; Health Connect retired"

      - name: Build unsigned release APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify unsigned APK embeds exact V36 web source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          expected = "620c5c3b202b1be86f49bc5dfaec2abdc471c3ea474e632f31b3c21298508bc3"
          marker = b'window.DT_MARC_RELEASE_FIX_VERSION="36.12-phase12-authoritative-state-consolidation"'
          candidates = [
              Path("android/app/build/outputs/apk/release/app-release-unsigned.apk"),
              Path("android/app/build/outputs/apk/release/app-release.apk"),
          ]
          apk = next((x for x in candidates if x.exists()), None)
          if not apk:
              raise SystemExit("No unsigned/release APK found for embedded-web verification")
          with zipfile.ZipFile(apk) as z:
              name = "assets/public/index.html"
              if name not in z.namelist():
                  raise SystemExit(f"{name} missing inside {apk}")
              data = z.read(name)
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"APK embedded index.html SHA256 mismatch: expected {expected}, got {actual}")
          if marker not in data:
              raise SystemExit("V36 marker missing inside APK embedded index.html")
          print(f"Unsigned APK embedded V36 index.html SHA256 PASS: {actual}")
          print("Unsigned APK V36 marker PASS")
          PY

      - name: Decode permanent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MARC_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/marc-release.jks"
          test -s "$RUNNER_TEMP/marc-release.jks"

      - name: Locate Android signing tools
        id: tools
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          echo "zipalign=$BUILD_TOOLS_DIR/zipalign" >> "$GITHUB_OUTPUT"
          echo "apksigner=$BUILD_TOOLS_DIR/apksigner" >> "$GITHUB_OUTPUT"

      - name: Align and sign release APK
        env:
          ZIPALIGN: ${{ steps.tools.outputs.zipalign }}
          APKSIGNER: ${{ steps.tools.outputs.apksigner }}
          KEYSTORE_PASSWORD: ${{ secrets.MARC_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARC_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MARC_ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            UNSIGNED_APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            echo "No release APK found in android/app/build/outputs/apk/release"
            find android/app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi
          mkdir -p release-output
          ALIGNED="release-output/MARC-v${VERSION_NAME}-aligned.apk"
          SIGNED="release-output/MARC-v${VERSION_NAME}-signed.apk"
          "$ZIPALIGN" -p -f -v 4 "$UNSIGNED_APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/marc-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          python3 - "$SIGNED" <<'PY'
          from pathlib import Path
          import hashlib, sys, zipfile
          apk = Path(sys.argv[1])
          expected = "620c5c3b202b1be86f49bc5dfaec2abdc471c3ea474e632f31b3c21298508bc3"
          marker = b'window.DT_MARC_RELEASE_FIX_VERSION="36.12-phase12-authoritative-state-consolidation"'
          with zipfile.ZipFile(apk) as z:
              name = "assets/public/index.html"
              if name not in z.namelist():
                  raise SystemExit(f"{name} missing inside signed APK")
              data = z.read(name)
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"Signed APK embedded index.html mismatch: expected {expected}, got {actual}")
          if marker not in data:
              raise SystemExit("V36.12 Phase 12 marker missing inside signed APK")
          print(f"Signed APK embedded V36 index.html SHA256 PASS: {actual}")
          print("Signed APK V36 marker PASS")
          PY
          sha256sum "$SIGNED" | tee "release-output/MARC-v${VERSION_NAME}-signed.apk.sha256"
          rm -f "$ALIGNED" "$RUNNER_TEMP/marc-release.jks"

      - name: Upload signed public release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARC-v${{ inputs.version_name }}-SIGNED-RELEASE
          path: |
            release-output/MARC-v${{ inputs.version_name }}-signed.apk
            release-output/MARC-v${{ inputs.version_name }}-signed.apk.sha256
          if-no-files-found: error
          retention-days: 90
