name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Install Health Connect native bridge
        run: |
          PKG="android/app/src/main/java/com/mrcdrnzz/dailytracker"
          mkdir -p "$PKG"
          cp native/HealthConnectNativePlugin.java "$PKG/HealthConnectNativePlugin.java"
          cp native/MainActivity.java "$PKG/MainActivity.java"
          cp native/PermissionsRationaleActivity.java "$PKG/PermissionsRationaleActivity.java"
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Verify native bridge was installed
        run: |
          grep -q "registerPlugin(HealthConnectNativePlugin.class)" android/app/src/main/java/com/mrcdrnzz/dailytracker/MainActivity.java
          grep -q "android.permission.health.READ_SLEEP" android/app/src/main/AndroidManifest.xml
          echo "Health Connect bridge and permissions are present."

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
