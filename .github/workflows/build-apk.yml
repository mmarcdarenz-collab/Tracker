name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install npm dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Set Android minSdk for Health Connect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Health Connect client 1.1.0 requires Android API 26+.
          # Capacitor creates this file during `npx cap add android`.
          variables = Path("android/variables.gradle")
          if variables.exists():
              s = variables.read_text()
              s2, n = re.subn(
                  r'(minSdkVersion\s*=\s*)\d+',
                  r'\g<1>26',
                  s
              )
              if n == 0:
                  raise SystemExit("minSdkVersion not found in android/variables.gradle")
              variables.write_text(s2)
              print("Updated android/variables.gradle:")
              print(s2)
          else:
              raise SystemExit("android/variables.gradle not found")

          # Defensive fallback in case a generated app/build.gradle contains
          # a literal minSdk/minSdkVersion value.
          app_gradle = Path("android/app/build.gradle")
          if app_gradle.exists():
              s = app_gradle.read_text()
              s = re.sub(r'(?m)^(\s*minSdk(?:Version)?\s+)\d+\s*$', r'\g<1>26', s)
              app_gradle.write_text(s)
          PY

      - name: Add Health Connect SDK dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          dep='implementation "androidx.health.connect:connect-client:1.1.0"'
          if dep not in s:
              m=re.search(r'dependencies\s*\{', s)
              if not m:
                  raise SystemExit("dependencies block not found in android/app/build.gradle")
              pos=m.end()
              s=s[:pos]+"\n    "+dep+s[pos:]
              p.write_text(s)
          print(p.read_text())
          PY

      - name: Sync web app
        run: npx cap sync android

      - name: Install Health Connect native bridge
        run: |
          PKG="android/app/src/main/java/com/mrcdrnzz/dailytracker"
          mkdir -p "$PKG"
          cp native/HealthConnectNativePlugin.java "$PKG/HealthConnectNativePlugin.java"
          cp native/MainActivity.java "$PKG/MainActivity.java"
          cp native/PermissionsRationaleActivity.java "$PKG/PermissionsRationaleActivity.java"
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Verify Health Connect setup
        run: |
          echo "Checking minSdk..."
          grep -n 'minSdkVersion' android/variables.gradle
          echo "Checking dependency..."
          grep -n 'androidx.health.connect:connect-client:1.1.0' android/app/build.gradle
          echo "Checking plugin registration..."
          grep -n 'registerPlugin(HealthConnectNativePlugin.class)' android/app/src/main/java/com/mrcdrnzz/dailytracker/MainActivity.java
          echo "Checking manifest permission..."
          grep -n 'android.permission.health.READ_SLEEP' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
